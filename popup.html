<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO Admin Block Injector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    width: 420px;
    background: #f5f5f5;
    color: #1a1a1a;
    font-size: 13px;
  }

  .header {
    background: #1a6e9f;
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 { font-size: 14px; font-weight: 600; }
  .header span { font-size: 11px; opacity: 0.75; margin-left: auto; }

  .body { padding: 14px 16px; }

  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  textarea {
    width: 100%;
    height: 130px;
    padding: 8px 10px;
    font-size: 11px;
    font-family: 'SF Mono', 'Menlo', monospace;
    border: 1px solid #d0d0d0;
    border-radius: 6px;
    background: #fff;
    color: #1a1a1a;
    resize: vertical;
    line-height: 1.5;
  }
  textarea:focus { outline: none; border-color: #1a6e9f; box-shadow: 0 0 0 2px rgba(26,110,159,0.15); }

  .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }

  button {
    height: 32px;
    padding: 0 14px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid #d0d0d0;
    background: #fff;
    color: #1a1a1a;
    transition: background 0.1s;
  }
  button:hover { background: #f0f0f0; }
  button:active { transform: scale(0.98); }
  button.primary { background: #1a6e9f; color: #fff; border-color: transparent; }
  button.primary:hover { background: #155f8a; }
  button.primary:disabled { background: #a0c4d8; cursor: not-allowed; transform: none; }
  button.danger { background: #fff; color: #c0392b; border-color: #c0392b; }
  button.danger:hover { background: #fdf0ee; }

  #parseBtn { flex: 1; }
  #clearBtn { }

  .blocks-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .blocks-header span { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }
  .blocks-header small { font-size: 11px; color: #888; }

  #blockList { display: none; }

  .block-item {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .block-item.done { border-color: #27ae60; background: #f0faf4; }
  .block-item.error { border-color: #e74c3c; background: #fdf0ee; }
  .block-item.active { border-color: #1a6e9f; background: #eef6fb; }

  .block-num {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #e8e8e8;
    color: #555;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .block-item.done .block-num { background: #27ae60; color: #fff; }
  .block-item.error .block-num { background: #e74c3c; color: #fff; }
  .block-item.active .block-num { background: #1a6e9f; color: #fff; }

  .block-info { flex: 1; min-width: 0; }
  .block-name-input {
    width: 100%;
    height: 26px;
    padding: 0 6px;
    font-size: 12px;
    border: 1px solid #d8d8d8;
    border-radius: 4px;
    background: #fafafa;
    color: #1a1a1a;
    margin-bottom: 3px;
  }
  .block-name-input:focus { outline: none; border-color: #1a6e9f; }
  .block-section-select {
    width: 100%;
    height: 24px;
    padding: 0 6px;
    font-size: 11px;
    border: 1px solid #d8d8d8;
    border-radius: 4px;
    background: #fafafa;
    color: #555;
    margin-bottom: 3px;
    cursor: pointer;
  }
  .block-section-select:focus { outline: none; border-color: #1a6e9f; }

  .block-meta { font-size: 10px; color: #999; }

  .block-toggle {
    font-size: 10px;
    color: #1a6e9f;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .block-toggle:hover { text-decoration: underline; }

  .block-preview {
    display: none;
    margin-top: 6px;
    padding: 6px 8px;
    background: #f8f8f8;
    border-radius: 4px;
    font-size: 10px;
    font-family: 'SF Mono', monospace;
    color: #555;
    max-height: 80px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    border: 1px solid #e8e8e8;
  }

  .status-bar {
    display: none;
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.4;
  }
  .status-bar.info { display: block; background: #eef6fb; color: #1a6e9f; border: 1px solid #b8d9ed; }
  .status-bar.success { display: block; background: #f0faf4; color: #27ae60; border: 1px solid #a8dbb8; }
  .status-bar.error { display: block; background: #fdf0ee; color: #c0392b; border: 1px solid #f0b8b0; }
  .status-bar.warning { display: block; background: #fefae8; color: #b8860b; border: 1px solid #e8d888; }

  .run-row { display: flex; gap: 8px; margin-top: 12px; }
  #runBtn { flex: 1; }

  .progress-bar-wrap { height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 8px; display: none; }
  .progress-bar { height: 4px; background: #1a6e9f; border-radius: 2px; transition: width 0.3s; width: 0%; }

  .divider { border: none; border-top: 1px solid #e8e8e8; margin: 14px 0; }

  .disable-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .disable-panel-header label { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }

  .section-checks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    margin-bottom: 10px;
  }
  .section-check-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #333;
    cursor: pointer;
    user-select: none;
  }
  .section-check-item input[type="checkbox"] { cursor: pointer; accent-color: #1a6e9f; }

  .disable-row { display: flex; gap: 8px; }
  #disableBtn { flex: 1; }

  .progress-bar-wrap.disable { margin-top: 6px; }

  .not-on-cms {
    padding: 24px 20px;
    text-align: center;
    color: #888;
  }
  .not-on-cms strong { display: block; color: #1a1a1a; margin-bottom: 6px; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <h1>ECO Admin Block Injector</h1>
  <span id="pageStatus">checking...</span>
</div>

<div id="mainContent" class="body" style="display:none">

  <div id="disablePanel">
    <div class="disable-panel-header">
      <label>Disable existing blocks</label>
    </div>
    <div class="section-checks" id="sectionChecks"></div>
    <div class="disable-row">
      <button id="disableBtn" class="primary">Disable existing</button>
      <button id="deleteBtn" class="danger">Delete live</button>
      <button id="exportBtn">Export HTML</button>
      <button id="disableStopBtn" class="danger" style="display:none">Stop</button>
    </div>
    <div class="progress-bar-wrap disable" id="disableProgressWrap">
      <div class="progress-bar" id="disableProgressBar"></div>
    </div>
    <div class="status-bar" id="disableStatusBar"></div>
  </div>

  <hr class="divider">

  <div class="field">
    <label>Paste full page HTML</label>
    <textarea id="htmlInput" placeholder="Paste your full HTML here — each .container or .container-fluid becomes a separate block..."></textarea>
  </div>

  <div class="btn-row">
    <button id="parseBtn" class="primary">Parse blocks</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div id="blockList">
    <div class="blocks-header">
      <span>Blocks found</span>
      <small id="blockCount"></small>
    </div>
    <div id="blockItems"></div>

    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="run-row">
      <button id="runBtn" class="primary" disabled>Run all → CMS</button>
      <button id="stopBtn" class="danger" style="display:none">Stop</button>
    </div>
  </div>

  <div class="status-bar" id="statusBar"></div>

</div>

<div id="notCms" class="not-on-cms" style="display:none">
  <strong>Not on ECO Admin</strong>
  Navigate to an ECO Admin page editor to use this tool.
</div>

<script src="popup.js"></script>
</body>
</html>
